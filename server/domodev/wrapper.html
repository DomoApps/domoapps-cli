<html>
  <head>
    <style>
      body{
        background: red;
        background: #fbfbfb;
      }

      iframe{
        border: 1px solid #e4e5e5;
        background: #fff;
      }

      .wrapper{
        margin: 0 auto;
        margin-top: 36px;
      }

      .size{
        float: right;
        color:  #dddddd;
        font-size: 12px;
        font-family: 'Open Sans', 'Helvetica Neue', Arial, Helvetica, sans-serif;
      }

      .note{
        text-align: center;
        font-size: 24px;
        padding-top: 20px;
      }

      .error{
        color: red;
      }

      .warn{
        color: orange;
      }
    </style>
  </head>

  <body>
    <% if (!isValidSession) { %>
      <div class="error note">Your session has expired. Please login again using domo login.</div>
    <% } %>

    <% if (!isValidContext) { %>
      <div class="warn note">Note: Fetching data from Domo requires the design to be published first.</div>
    <% } %>

    <div class="wrapper" style="width: <%- width %>px; height: <%- height %>px;">
      <!-- mappingOverride is run through JSON.stringify() and then $.param -->
      <iframe style="width: 100%; height: 100%;" src="<%- url %>"></iframe>
      <div class="size"><%- width %> x <%- height %></div>
    </div>
    <script src="domodev/lodash.js"></script>
    <script src="domodev/wrapper.js"></script>
  </body>

</html>
